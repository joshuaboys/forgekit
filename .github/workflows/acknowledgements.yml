# Acknowledgements freshness.

name: Acknowledgements

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licences-drift:
    name: Licences single-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licences single-source drift check
        run: tools/starters/acknowledgements/expand-licences.sh --check

  acknowledgements-diff:
    name: Acknowledgements freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.4
      - name: Acknowledgements freshness
        run: tools/starters/acknowledgements/generate-acknowledgements.sh --check
