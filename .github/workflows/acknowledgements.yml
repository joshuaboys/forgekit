# Acknowledgements freshness. Action tags are placeholders — pin to commit
# SHAs before relying on this in production CI.
#
# generate-acknowledgements.sh --check is commented until a Cargo.toml /
# Cargo.lock exists (CORE/CLI crates). expand-licences --check is live now.

name: Acknowledgements

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licences-drift:
    name: Licences single-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licences single-source drift check
        run: tools/starters/acknowledgements/expand-licences.sh --check

