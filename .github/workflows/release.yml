# Build static binaries and attach them to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner: the macos-13 x86_64 image is
          # retired and its jobs never get picked up.
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p forgekit-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          tar -czf "forgekit-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" forgekit
          shasum -a 256 "forgekit-${{ matrix.target }}.tar.gz" \
            > "forgekit-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: forgekit-${{ matrix.target }}
          path: forgekit-${{ matrix.target }}.tar.gz*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
