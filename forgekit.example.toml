# Example Forgekit host config.
# Create one quickly with:  forgekit init
#
# Copy to forgekit.toml (gitignored) or run `forgekit init`.

listen = "127.0.0.1:8088"
mode = "local"
backend = "filesystem"
data_dir = "./data"

[github]
# Logical remote name stored on promote events.
remote = "github"
# owner/repo on GitHub — required when push = true
repository = ""
# Env var holding a token with `contents: write` (e.g. GITHUB_TOKEN)
token_env = "GITHUB_TOKEN"
# When true, promote pushes evidence to refs/heads/forgekit/promotes
push = false
required_checkpoint_kind = "release"

# Optional cloud object store — set backend = "r2" to use
[r2]
bucket = ""
endpoint = ""   # e.g. https://<accountid>.r2.cloudflarestorage.com
region = "auto"
access_key_env = "R2_ACCESS_KEY_ID"
secret_key_env = "R2_SECRET_ACCESS_KEY"
prefix = ""
