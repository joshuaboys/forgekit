[package]
name = "forgekit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forgekit command-line binary"

[[bin]]
name = "forgekit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
forgekit-core = { path = "../forgekit-core" }
forgekit-server = { path = "../forgekit-server" }
forgekit-store = { path = "../forgekit-store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
