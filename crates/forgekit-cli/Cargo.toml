[package]
name = "forgekit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forgekit command-line binary"

[[bin]]
name = "forgekit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
forgekit-core = { path = "../forgekit-core" }
forgekit-github = { path = "../forgekit-github" }
forgekit-server = { path = "../forgekit-server" }
forgekit-store = { path = "../forgekit-store" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
